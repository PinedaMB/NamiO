appId: dev.namio.app
productName: NamiO
copyright: Copyright © 2026 PinedaMB

directories:
  buildResources: build
  output: release

# Solo la app compilada: electron-builder agrega las dependencias de producción
# de package.json (imapflow, mailparser, nodemailer) y descarta las de desarrollo.
files:
  - out/**
  - package.json

# Avisos accesibles junto a los recursos de la aplicación, fuera del asar.
extraResources:
  - from: LICENSE
    to: licenses/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md

asar: true
asarUnpack:
  # Nada nativo por ahora: node:sqlite viene en Electron, no hay .node que extraer.

linux:
  target:
    - AppImage
    - deb
  icon: icon.png
  category: Network;Email
  synopsis: Cliente de correo de escritorio
  description: Cliente de correo de escritorio multiplataforma IMAP/SMTP con caché local.
  # WM_CLASS / app_id: sin esto, GNOME y KDE no asocian la ventana con el .desktop
  # (el nombre va en package.json: "desktopName").
  syncDesktopName: true
  maintainer: PinedaMB <mendez-pineda@outlook.es>
  desktop:
    entry:
      Name: NamiO
      Comment: Cliente de correo
      Keywords: email;mail;imap;
      Categories: Network;Email;

win:
  target:
    - nsis
  icon: icon.png
