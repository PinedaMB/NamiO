name: release-windows

# Complementa a release-linux: con el mismo tag `v*` genera el instalador NSIS
# en windows-latest y lo adjunta a la misma Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verificar versión del tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "require('node:assert/strict').equal(process.env.GITHUB_REF_NAME, 'v' + require('./package.json').version)"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Pruebas de regresión
        run: pnpm test

      - name: Compilar
        run: pnpm run build

      # Si los secretos existen, electron-builder firma el instalador y
      # `app-update.yml` lleva el publisher; sin ellos el artefacto queda sin
      # firma y el actualizador no puede verificar el editor.
      - name: Empaquetar (NSIS)
        run: pnpm exec electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Generar sumas SHA-256
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: namio-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS

      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS
          generate_release_notes: true
          # Una -rc no debe convertirse en la Release "latest" del canal estable.
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
