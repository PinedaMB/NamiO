name: release-windows

# Complementa a release-linux: con el mismo tag `v*` genera el instalador NSIS
# en windows-latest y lo adjunta a la misma Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verificar versión del tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "require('node:assert/strict').equal(process.env.GITHUB_REF_NAME, 'v' + require('./package.json').version)"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar
        run: pnpm run build

      - name: Empaquetar (NSIS)
        run: pnpm exec electron-builder --win --publish never

      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: namio-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          generate_release_notes: true
